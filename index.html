<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deporte y Vida F.C.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#0a0e2e;
    --pitch:#12173f;
    --pitch-line:#2b3172;
    --chalk:#f4f6f2;
    --chalk-dim:#a7add4;
    --accent:#4fc93e;
    --accent-dim:#2c7a24;
    --red:#e5564d;
    --green-ok:#4fc93e;
    --amber:#e0a83c;
    --card:#161c4a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html, body{
    background:var(--pitch-dark);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--accent);color:var(--pitch-dark);}

  .field-bg{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(79,201,62,0.08), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 90px),
      var(--pitch-dark);
  }

  a{color:var(--accent);}
  button{font-family:inherit;}

  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 80px;}

  /* HEADER */
  header.top{
    border-bottom:1px solid var(--pitch-line);
    padding:22px 0 18px;
    margin-bottom:6px;
  }
  .top-inner{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    max-width:1180px; margin:0 auto; padding:0 24px;
  }
  .crest{display:flex; align-items:center; gap:14px;}
  .crest-badge{
    width:50px;height:50px;border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    box-shadow:0 0 0 3px var(--pitch-dark), 0 0 0 4px var(--accent-dim);
  }
  .crest-badge img{width:100%;height:100%;object-fit:cover;}
  .crest h1{
    font-family:'Anton',sans-serif; font-weight:400; letter-spacing:0.5px;
    font-size:22px; margin:0; line-height:1;
    text-transform:uppercase;
  }
  .crest .sub{font-size:12px; color:var(--chalk-dim); letter-spacing:1.5px; text-transform:uppercase; margin-top:4px;}

  .top-right{display:flex; align-items:center; gap:12px;}
  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--pitch-line);
    border-radius:999px; padding:8px 14px; color:var(--chalk-dim); flex:1; min-width:180px; max-width:260px;
  }
  .search-box svg{flex-shrink:0;}
  .search-box input{
    background:none; border:none; color:var(--chalk); font-size:13px; font-family:'Inter',sans-serif;
    outline:none; width:100%;
  }
  .search-box input::placeholder{color:var(--chalk-dim);}
  .tabs{display:flex; gap:4px; background:var(--pitch); padding:4px; border-radius:999px; border:1px solid var(--pitch-line); flex-wrap:wrap;}
  .tab-btn{
    border:none; background:transparent; color:var(--chalk-dim);
    padding:9px 16px; border-radius:999px; cursor:pointer; font-weight:600; font-size:13px;
    letter-spacing:0.3px; white-space:nowrap;
  }
  .tab-btn.active{background:var(--accent); color:var(--pitch-dark);}

  .gear-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--pitch-line);
    background:var(--pitch); color:var(--chalk-dim); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .gear-btn:hover{color:var(--chalk); border-color:var(--accent-dim);}
  .status-pill{
    font-size:11px; color:var(--chalk-dim); display:flex; align-items:center; gap:5px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--red); display:inline-block;}
  .dot.ok{background:var(--green-ok);}

  /* FILTER BAR */
  .filterbar{
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
    padding:18px 0 24px; border-bottom:1px solid var(--pitch-line); margin-bottom:26px;
  }
  .filter-group{display:flex; align-items:center; gap:8px;}
  .filter-group label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--chalk-dim);}
  select{
    background:var(--card); color:var(--chalk); border:1px solid var(--pitch-line);
    padding:7px 10px; border-radius:6px; font-size:13px; font-family:'Inter',sans-serif;
  }
  input[type=date], input[type=time]{
    background:var(--card); color:var(--chalk); border:1px solid var(--pitch-line);
    padding:6.5px 10px; border-radius:6px; font-size:13px; font-family:'Inter',sans-serif;
  }
  input[type=number]{
    background:var(--card); color:var(--chalk); border:1px solid var(--pitch-line);
    padding:6.5px 10px; border-radius:6px; font-size:13px; font-family:'Inter',sans-serif;
  }
  .add-btn{
    margin-left:auto; background:var(--accent); color:var(--pitch-dark); border:none;
    padding:9px 18px; border-radius:6px; font-weight:700; cursor:pointer; font-size:13.5px;
  }
  .add-btn:hover{filter:brightness(1.08);}

  /* GROUP SECTIONS */
  .group-title{display:flex; align-items:baseline; gap:12px; margin:34px 0 16px;}
  .group-title h2{
    font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase;
    font-size:22px; letter-spacing:0.5px; margin:0; color:var(--accent);
  }
  .group-title .count{font-size:12px; color:var(--chalk-dim);}
  .group-title::after{content:''; flex:1; height:1px; background:repeating-linear-gradient(90deg, var(--pitch-line) 0 6px, transparent 6px 12px);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px;}

  /* PLAYER CARD */
  .pcard{
    background:var(--card); border:1px solid var(--pitch-line); border-radius:var(--radius);
    padding:16px; cursor:pointer; position:relative; transition:transform .12s ease, border-color .12s ease;
  }
  .pcard:hover{border-color:var(--accent-dim); transform:translateY(-2px);}
  .pcard-top{display:flex; align-items:center; gap:12px;}
  .pphoto{
    width:44px; height:44px; border-radius:50%; overflow:hidden; flex-shrink:0;
    background:var(--pitch-line); display:flex; align-items:center; justify-content:center;
    border:1px solid var(--pitch-line);
  }
  .pphoto img{width:100%;height:100%;object-fit:cover;}
  .pphoto svg{width:60%; height:60%; opacity:0.5;}
  .pcard-headtext{flex:1; min-width:0;}
  .pnum{font-family:'Anton',sans-serif; font-size:18px; color:var(--accent); line-height:1;}
  .pos-badge{
    font-size:10px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:var(--pitch-line); color:var(--chalk); padding:2px 7px; border-radius:4px; margin-left:6px;
  }
  .pname{font-weight:600; font-size:14.5px; margin:9px 0 2px; line-height:1.25;}
  .pyear{font-size:12px; color:var(--chalk-dim); margin-bottom:10px;}
  .pmeta{display:flex; gap:14px; margin-top:8px; font-size:11px;}
  .pmeta-item{display:flex; align-items:center; gap:5px;}
  .meta-dot{width:7px;height:7px;border-radius:50%;}
  .meta-dot.ok{background:var(--green-ok);}
  .meta-dot.bad{background:var(--red);}
  .meta-dot.mid{background:var(--amber);}

  .empty-state{text-align:center; padding:60px 20px; color:var(--chalk-dim); font-size:14px;}
  .empty-state b{color:var(--chalk);}

  /* MODAL */
  .overlay{
    position:fixed; inset:0; background:rgba(5,15,11,0.75); backdrop-filter:blur(3px);
    display:none; align-items:flex-start; justify-content:center; z-index:50; padding:40px 16px; overflow-y:auto;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--pitch); border:1px solid var(--pitch-line); border-radius:14px;
    width:100%; max-width:560px; padding:28px; animation:pop .15s ease;
  }
  .modal.narrow{max-width:400px;}
  @keyframes pop{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .modal-head h3{font-family:'Barlow Condensed',sans-serif; font-size:24px; text-transform:uppercase; margin:0; color:var(--accent);}
  .close-x{background:none; border:none; color:var(--chalk-dim); font-size:22px; cursor:pointer; line-height:1;}

  .photo-row{display:flex; align-items:center; gap:16px; margin-bottom:20px;}
  .photo-big{
    width:76px; height:76px; border-radius:50%; overflow:hidden; background:var(--card);
    border:1px solid var(--pitch-line); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .photo-big img{width:100%;height:100%;object-fit:cover;}
  .photo-big svg{width:55%; height:55%; opacity:0.4;}
  .photo-actions label.upload-btn{
    display:inline-block; background:var(--card); border:1px solid var(--pitch-line); color:var(--chalk);
    padding:8px 14px; border-radius:6px; font-size:12.5px; cursor:pointer; font-weight:600;
  }
  .photo-actions label.upload-btn:hover{border-color:var(--accent-dim);}
  .photo-actions input[type=file]{display:none;}
  .photo-hint{font-size:11px; color:var(--chalk-dim); margin-top:6px;}

  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .field-row.single{grid-template-columns:1fr;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--chalk-dim); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--card); border:1px solid var(--pitch-line); color:var(--chalk);
    padding:9px 10px; border-radius:6px; font-size:13.5px; font-family:'Inter',sans-serif;
  }
  .field textarea{resize:vertical; min-height:80px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--accent);
    margin:20px 0 10px; font-weight:700;
  }
  .doc-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .doc-check{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--pitch-line);
    padding:8px 10px; border-radius:6px; font-size:13px; cursor:pointer;
  }
  .doc-check input{width:16px; height:16px; accent-color:var(--accent);}

  .modal-actions{display:flex; gap:10px; margin-top:22px; justify-content:space-between; align-items:center;}
  .btn{border:none; padding:10px 18px; border-radius:6px; font-weight:700; cursor:pointer; font-size:13.5px;}
  .btn-primary{background:var(--accent); color:var(--pitch-dark);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; border:1px solid var(--pitch-line); color:var(--chalk-dim);}
  .btn-danger{background:transparent; border:1px solid var(--red); color:var(--red);}
  .save-msg{font-size:12px; color:var(--green-ok);}

  /* TABLE VIEWS */
  .tbl-wrap{overflow-x:auto; border:1px solid var(--pitch-line); border-radius:10px;}
  table.datatbl{width:100%; border-collapse:collapse; min-width:640px;}
  table.datatbl th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--chalk-dim);
    padding:10px 12px; border-bottom:1px solid var(--pitch-line); background:var(--pitch); position:sticky; top:0;
    white-space:nowrap;
  }
  table.datatbl td{padding:9px 12px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px; white-space:nowrap;}
  table.datatbl tr:hover td{background:rgba(255,255,255,0.02);}
  table.datatbl input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer;}
  .pay-input{
    background:var(--card); border:1px solid var(--pitch-line); color:var(--chalk);
    padding:6px 9px; border-radius:6px; font-size:13px; width:180px;
  }
  .row-save-msg{font-size:11px; color:var(--green-ok); margin-left:8px;}
  .complete-tag{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:4px;}
  .complete-tag.ok{background:rgba(79,201,62,0.18); color:var(--green-ok);}
  .complete-tag.bad{background:rgba(229,86,77,0.18); color:var(--red);}

  /* ATTENDANCE VIEW */
  .att-toolbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px;}
  .att-toolbar input[type=date]{
    background:var(--card); border:1px solid var(--pitch-line); color:var(--chalk);
    padding:8px 10px; border-radius:6px; font-size:13.5px;
  }
  .toggle{display:inline-flex; border-radius:999px; overflow:hidden; border:1px solid var(--pitch-line);}
  .toggle button{border:none; padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; background:var(--card); color:var(--chalk-dim);}
  .toggle button.on-present{background:var(--green-ok); color:var(--pitch-dark);}
  .toggle button.on-absent{background:var(--red); color:var(--pitch-dark);}
  .pct-bar-wrap{width:70px; height:6px; background:var(--card); border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px;}
  .pct-bar{height:100%; background:var(--accent);}

  /* EVENTOS / COMUNICACIÓN TAB */
  .event-card{
    background:var(--card); border:1px solid var(--pitch-line); border-radius:var(--radius);
    padding:20px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .event-info h4{margin:0 0 6px 0; font-size:16px; color:var(--accent); text-transform:uppercase; font-family:'Barlow Condensed',sans-serif;}
  .event-info p{margin:0; font-size:13.5px; color:var(--chalk-dim); line-height:1.4;}

  .setup-screen{
    max-width:460px; margin:80px auto; background:var(--card); border:1px solid var(--pitch-line);
    border-radius:14px; padding:32px; text-align:center;
  }
  .setup-screen h2{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; color:var(--accent); font-size:22px; margin-top:8px;}
  .setup-screen p{color:var(--chalk-dim); font-size:13.5px; line-height:1.6;}
  .setup-screen input{
    width:100%; background:var(--pitch-dark); border:1px solid var(--pitch-line); color:var(--chalk);
    padding:10px 12px; border-radius:6px; font-size:13px; font-family:monospace; margin:14px 0;
  }
  .setup-screen .err{padding:8px; font-size:12.5px;}

  @media(max-width:640px){
    .field-row{grid-template-columns:1fr;}
    .doc-grid{grid-template-columns:1fr;}
    .top-inner{flex-direction:column; align-items:flex-start;}
    .top-right{width:100%; flex-wrap:wrap;}
    .search-box{max-width:none; order:3; width:100%;}
    .tabs{order:2;}
  }
</style>
</head>
<body>
<div class="field-bg"></div>

<!-- CANDADO DE ACCESO -->
<div id="gateOverlay" style="position:fixed; inset:0; background:var(--pitch-dark); z-index:999; display:flex; align-items:center; justify-content:center; padding:20px;">
  <div style="max-width:360px; width:100%; background:var(--card); border:1px solid var(--pitch-line); border-radius:14px; padding:32px; text-align:center;">
    <div style="width:56px;height:56px;border-radius:50%;background:#fff;margin:0 auto 16px;overflow:hidden;">
      <img id="gateLogo" src="" alt="" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <h2 style="font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; color:var(--accent); font-size:20px; margin:0 0 8px;">Acceso del equipo</h2>
    <p style="color:var(--chalk-dim); font-size:13px; margin:0 0 16px;">Ingresa la contraseña para ver la plantilla.</p>
    <input type="password" id="gatePassword" placeholder="Contraseña" style="width:100%; background:var(--pitch-dark); border:1px solid var(--pitch-line); color:var(--chalk); padding:10px 12px; border-radius:6px; font-size:14px; margin-bottom:10px; box-sizing:border-box;">
    <button id="gateSubmit" style="width:100%; background:var(--accent); color:var(--pitch-dark); border:none; padding:10px; border-radius:6px; font-weight:700; cursor:pointer; font-size:13.5px;">Entrar</button>
    <div id="gateError" style="color:var(--red); font-size:12px; margin-top:10px; display:none;">Contraseña incorrecta.</div>
  </div>
</div>
