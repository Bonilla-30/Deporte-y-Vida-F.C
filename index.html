<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avisar una falta — Deporte y Vida F.C.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#0a0e2e; --pitch:#12173f; --pitch-line:#2b3172;
    --chalk:#f4f6f2; --chalk-dim:#a7add4;
    --accent:#4fc93e; --accent-dim:#2c7a24;
    --red:#e5564d; --card:#161c4a;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--pitch-dark); color:var(--chalk); font-family:'Inter',sans-serif; min-height:100vh;}
  .field-bg{
    position:fixed; inset:0; z-index:-1;
    background: radial-gradient(ellipse at 50% -10%, rgba(79,201,62,0.08), transparent 55%), var(--pitch-dark);
  }
  .wrap{max-width:460px; margin:0 auto; padding:40px 20px 60px;}
  .crest{display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:28px;}
  .crest-badge{width:50px;height:50px;border-radius:50%; background:#fff; overflow:hidden; box-shadow:0 0 0 3px var(--pitch-dark), 0 0 0 4px var(--accent-dim);}
  .crest-badge img{width:100%;height:100%;object-fit:cover;}
  h1{font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; font-size:20px; margin:0; text-align:center;}
  .sub{text-align:center; color:var(--chalk-dim); font-size:12.5px; margin-top:4px; margin-bottom:28px;}
 
  .card{background:var(--card); border:1px solid var(--pitch-line); border-radius:14px; padding:26px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--chalk-dim); margin-bottom:6px;}
  .field input, .field select{
    width:100%; background:var(--pitch-dark); border:1px solid var(--pitch-line); color:var(--chalk);
    padding:11px 12px; border-radius:8px; font-size:14.5px; font-family:'Inter',sans-serif; box-sizing:border-box;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
 
  .btn{
    width:100%; background:var(--accent); color:var(--pitch-dark); border:none;
    padding:14px; border-radius:8px; font-weight:700; font-size:15px; cursor:pointer; margin-top:6px;
  }
  .btn:disabled{opacity:0.6;}
  .btn:hover:not(:disabled){filter:brightness(1.08);}
 
  .msg{margin-top:16px; font-size:13.5px; text-align:center;}
  .msg.ok{color:var(--accent);}
  .msg.err{color:var(--red);}
 
  .success{display:none; text-align:center; padding:20px 0;}
  .success .check{
    width:56px;height:56px;border-radius:50%; background:var(--accent); color:var(--pitch-dark);
    display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 16px;
  }
  .success h2{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; color:var(--accent); margin:0 0 8px;}
  .success p{color:var(--chalk-dim); font-size:13.5px; line-height:1.6;}
  .again-btn{background:transparent; border:1px solid var(--pitch-line); color:var(--chalk-dim); padding:10px 18px; border-radius:8px; margin-top:14px; cursor:pointer; font-size:13px;}
</style>
</head>

      <div class="field">
        <label>Desde</label>
        <input type="date" id="f_desde">
      </div>
      <div class="field">
        <label>Hasta (si son varios días)</label>
        <input type="date" id="f_hasta">
      </div>
    </div>
    <div class="field">
      <label>Motivo (opcional)</label>
      <input type="text" id="f_motivo" placeholder="Ej. Cita médica, viaje, etc.">
    </div>
    <button class="btn" id="submitBtn">Enviar aviso</button>
    <div class="msg" id="statusMsg"></div>
  </div>
 
  <div class="card success" id="successCard">
    <div class="success">
      <div class="check">✓</div>
      <h2>Falta registrada</h2>
      <p>Se avisó automáticamente por correo al encargado del equipo. Gracias por avisar con tiempo.</p>
      <button class="again-btn" id="againBtn">Registrar otra</button>
    </div>
  </div>
</div>
 
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwVJVJmJCUtjjyvOj7rpY4GP_IG-_KINlKLZZRTkeFyxYCHzWZSg6TD4HpqV65e1EumkQ/exec';
 
async function cargarProfes(){
  const select = document.getElementById('f_nombre');
  try{
    const res = await fetch(API_URL + '?action=getAll');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const profes = data.profes || [];
    if (!profes.length){
      select.innerHTML = '<option value="">No hay profes registrados todavía</option>';
      return;
    }
    select.innerHTML = '<option value="">Elige tu nombre...</option>' +
      profes.map(p => `<option value="${p.nombre.replace(/"/g,'&quot;')}">${p.nombre}${p.rol ? ' — ' + p.rol : ''}</option>`).join('');
  }catch(err){
    select.innerHTML = '<option value="">No se pudo cargar la lista</option>';
  }
}
cargarProfes();
 
document.getElementById('submitBtn').onclick = async () => {
  const nombre = document.getElementById('f_nombre').value;
  const desde = document.getElementById('f_desde').value;
  const hasta = document.getElementById('f_hasta').value;
  const motivo = document.getElementById('f_motivo').value;
  const msg = document.getElementById('statusMsg');
  const btn = document.getElementById('submitBtn');
 
  if (!nombre){ msg.textContent = 'Elige tu nombre de la lista.'; msg.className = 'msg err'; return; }
  if (!desde){ msg.textContent = 'Elige al menos la fecha de inicio.'; msg.className = 'msg err'; return; }
 
  btn.disabled = true;
  msg.textContent = 'Enviando...';
  msg.className = 'msg';
 
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'reportarFalta', profeNombre: nombre, fechaInicio: desde, fechaFin: hasta, motivo })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('successCard').style.display = 'block';
  }catch(err){
    msg.textContent = 'No se pudo enviar. Intenta de nuevo. (' + err.message + ')';
    msg.className = 'msg err';
    btn.disabled = false;
  }
};
 
document.getElementById('againBtn').onclick = () => {
  document.getElementById('f_nombre').value = '';
  document.getElementById('f_desde').value = '';
  document.getElementById('f_hasta').value = '';
  document.getElementById('f_motivo').value = '';
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('successCard').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
};
</script>
</body>
</html>
